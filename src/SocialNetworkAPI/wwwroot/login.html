<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8"/>
    <title>Вход | SocNet</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link href="css/styles.css" rel="stylesheet"/>

    <style>
        body {
            background: var(--socnet-bg);
        }

        .auth-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            background: var(--bg-elevated);
        }

        .brand-badge {
            display: inline-grid;
            place-items: center;
            inline-size: 56px;
            block-size: 56px;
            border-radius: 50%;
        }
    </style>
</head>

<body class="ui-shell">
<a class="ui-skip-link" href="#login-main">Перейти к содержимому</a>

<nav aria-label="Основная навигация" class="navbar navbar-light bg-white border-bottom sticky-top py-2 px-3"
     role="navigation">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" href="index.html" style="letter-spacing:.5px;">SocNet</a>
        <button aria-label="Переключить тему" class="btn btn-sm btn-outline-secondary ms-auto" id="theme-toggle"
                type="button">
            <i aria-hidden="true" class="bi bi-moon"></i>
        </button>
    </div>
</nav>

<main class="container py-5" id="login-main" role="main" tabindex="-1">
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
            <section aria-labelledby="login-title" class="auth-card p-4 p-md-5">
                <div class="text-center mb-3">
                        <span class="brand-badge bg-primary text-white shadow-sm">
                            <i aria-hidden="true" class="bi bi-door-open fs-3"></i>
                        </span>
                </div>
                <h1 class="h4 text-center fw-bold mb-1" id="login-title">Вход в SocNet</h1>
                <p class="text-center text-muted mb-4">Рады видеть вас снова</p>

                <div class="alert alert-danger py-2 d-none" id="login-error" role="alert"></div>
                <div class="alert alert-success py-2 d-none" id="login-success" role="status"></div>

                <form aria-describedby="login-help" id="login-form" novalidate>
                    <div class="mb-3">
                        <div class="form-floating">
                            <input autocomplete="email" autofocus class="form-control ui-input" id="login-email"
                                   inputmode="email" name="email" placeholder="Email" required type="email"/>
                            <label for="login-email">Email</label>
                            <div class="invalid-feedback">Введите корректный email.</div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <div class="form-floating position-relative">
                            <input autocomplete="current-password" class="form-control ui-input" id="login-password"
                                   name="password"
                                   placeholder="Пароль" required type="password"/>
                            <label for="login-password">Пароль</label>
                            <div class="invalid-feedback">Введите пароль.</div>

                            <button aria-label="Показать пароль"
                                    class="btn btn-sm btn-outline-secondary position-absolute top-50 translate-middle-y end-0 me-2"
                                    data-action="togglePassword" data-target="#login-password"
                                    type="button">
                                <i aria-hidden="true" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input ui-check" id="remember-me" name="remember" type="checkbox"
                                   value="1"/>
                            <label class="form-check-label" for="remember-me">Запомнить меня</label>
                        </div>
                        <a aria-disabled="true" class="small text-decoration-underline" href="#">Забыли пароль?</a>
                    </div>

                    <button class="btn btn-primary w-100 py-2 rounded-pill" type="submit">
                        <span aria-hidden="true" class="me-1"><i class="bi bi-box-arrow-in-right"></i></span>
                        Войти
                    </button>

                    <p class="mt-4 text-center text-muted small">
                        Нет аккаунта?
                        <a class="link-primary" href="register.html">Зарегистрироваться</a>
                    </p>

                    <div class="visually-hidden" id="login-help">Все поля обязательны. Email — в формате
                        user@example.com.
                    </div>
                </form>
            </section>

            <p class="text-center mt-4 text-muted small">© 2025 SocNet</p>
        </div>
    </div>
</main>

<script src="js/shared.js" type="module"></script>
<script src="js/auth.js" type="module"></script>

<script>
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action="togglePassword"]');
        if (!btn) return;
        const input = document.querySelector(btn.getAttribute('data-target'));
        if (!input) return;
        const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        btn.setAttribute('aria-label', type === 'password' ? 'Показать пароль' : 'Скрыть пароль');
        const icon = btn.querySelector('i');
        if (icon) icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    }, {passive: true});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
