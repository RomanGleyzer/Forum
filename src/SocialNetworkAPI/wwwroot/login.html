<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Вход | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SocNet</a>
        </div>
    </nav>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm mt-5 rounded-4">
                    <div class="card-body">
                        <div class="text-center mb-3">
                            <span class="bg-primary bg-gradient text-white rounded-circle p-3 fs-2 shadow-sm">
                                <i class="bi bi-door-open"></i>
                            </span>
                        </div>
                        <form id="login-form" autocomplete="on">
                            <h2 class="card-title h4 mb-4 text-center fw-bold">Вход в SocNet</h2>
                            <div class="mb-3">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="login-email" name="email" placeholder="Email" required autofocus />
                                    <label for="login-email">Email</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-floating">
                                    <input type="password" class="form-control" id="login-password" name="password" placeholder="Пароль" required />
                                    <label for="login-password">Пароль</label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-door-open me-1"></i> Войти
                            </button>
                            <p class="mt-3 text-center text-secondary small">
                                Нет аккаунта?
                                <a href="register.html" class="text-primary fw-semibold text-decoration-none">Зарегистрироваться</a>
                            </p>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-4 text-muted">
                    © 2025 SocNet
                </div>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
