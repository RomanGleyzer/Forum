<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>Вход | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/styles.css" />

    <style>
        body {
            background: var(--socnet-bg);
        }

        .auth-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            background: var(--bg-elevated);
        }

        .brand-badge {
            display: inline-grid;
            place-items: center;
            inline-size: 56px;
            block-size: 56px;
            border-radius: 50%;
        }
    </style>
</head>

<body class="ui-shell">
    <a href="#login-main" class="ui-skip-link">Перейти к содержимому</a>

    <nav class="navbar navbar-light bg-white border-bottom sticky-top py-2 px-3" role="navigation"
        aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary fs-3" href="index.html" style="letter-spacing:.5px;">SocNet</a>
            <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-auto" aria-label="Переключить тему"
                type="button">
                <i class="bi bi-moon" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <main id="login-main" class="container py-5" role="main" tabindex="-1">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <section class="auth-card p-4 p-md-5" aria-labelledby="login-title">
                    <div class="text-center mb-3">
                        <span class="brand-badge bg-primary text-white shadow-sm">
                            <i class="bi bi-door-open fs-3" aria-hidden="true"></i>
                        </span>
                    </div>
                    <h1 id="login-title" class="h4 text-center fw-bold mb-1">Вход в SocNet</h1>
                    <p class="text-center text-muted mb-4">Рады видеть вас снова</p>

                    <div id="login-error" class="alert alert-danger py-2 d-none" role="alert"></div>
                    <div id="login-success" class="alert alert-success py-2 d-none" role="status"></div>

                    <form id="login-form" novalidate aria-describedby="login-help">
                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="email" class="form-control ui-input" id="login-email" name="email"
                                    placeholder="Email" inputmode="email" autocomplete="email" required autofocus />
                                <label for="login-email">Email</label>
                                <div class="invalid-feedback">Введите корректный email.</div>
                            </div>
                        </div>

                        <div class="mb-2">
                            <div class="form-floating position-relative">
                                <input type="password" class="form-control ui-input" id="login-password" name="password"
                                    placeholder="Пароль" autocomplete="current-password" required />
                                <label for="login-password">Пароль</label>
                                <div class="invalid-feedback">Введите пароль.</div>

                                <button type="button"
                                    class="btn btn-sm btn-outline-secondary position-absolute top-50 translate-middle-y end-0 me-2"
                                    aria-label="Показать пароль" data-action="togglePassword"
                                    data-target="#login-password">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input ui-check" type="checkbox" value="1" id="remember-me"
                                    name="remember" />
                                <label class="form-check-label" for="remember-me">Запомнить меня</label>
                            </div>
                            <a class="small text-decoration-underline" href="#" aria-disabled="true">Забыли пароль?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill">
                            <span class="me-1" aria-hidden="true"><i class="bi bi-box-arrow-in-right"></i></span>
                            Войти
                        </button>

                        <p class="mt-4 text-center text-muted small">
                            Нет аккаунта?
                            <a href="register.html" class="link-primary">Зарегистрироваться</a>
                        </p>

                        <div id="login-help" class="visually-hidden">Все поля обязательны. Email — в формате
                            user@example.com.</div>
                    </form>
                </section>

                <p class="text-center mt-4 text-muted small">© 2025 SocNet</p>
            </div>
        </div>
    </main>

    <script type="module" src="js/shared.js"></script>
    <script type="module" src="js/auth.js"></script>

    <script>
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action="togglePassword"]');
            if (!btn) return;
            const input = document.querySelector(btn.getAttribute('data-target'));
            if (!input) return;
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            btn.setAttribute('aria-label', type === 'password' ? 'Показать пароль' : 'Скрыть пароль');
            const icon = btn.querySelector('i');
            if (icon) icon.className = type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
        }, { passive: true });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
