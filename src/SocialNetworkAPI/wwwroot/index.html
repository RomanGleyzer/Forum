<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>SocNet — Лента</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SocNet</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Лента</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Друзья</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Сообщения</a></li>
                    <li class="nav-item" id="profile-nav" style="display:none;"><a class="nav-link" href="profile.html">Профиль</a></li>
                    <li class="nav-item" id="login-nav"><a class="nav-link" href="login.html">Войти</a></li>
                    <li class="nav-item" id="register-nav"><a class="nav-link" href="register.html">Регистрация</a></li>
                    <li class="nav-item" id="logout-nav" style="display:none;"><a class="nav-link" href="#">Выйти</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        <div class="row justify-content-center">
            <!-- Sidebar left -->
            <aside class="col-lg-3 d-none d-lg-block">
                <div class="card mb-4 shadow-sm border-0">
                    <div class="card-body text-center">
                        <img src="images/user-default.png" alt="User avatar" class="rounded-circle mb-2" width="80" height="80">
                        <div id="sidebar-username" class="fw-bold"></div>
                    </div>
                </div>
                <div class="card mb-4 shadow-sm border-0">
                    <div class="card-body p-3">
                        <input type="search" class="form-control" placeholder="Поиск по ленте...">
                    </div>
                </div>
            </aside>
            <!-- Feed center -->
            <div class="col-lg-6">
                <div class="feed-bg p-3 p-md-4 mb-4">
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-house-heart text-primary fs-3 me-3"></i>
                        <span class="fw-semibold fs-5">Лента</span>
                    </div>
                    <section id="create-post" style="display:none;">
                        <div class="card mb-4 post-card">
                            <div class="card-body">
                                <form id="post-form">
                                    <div class="d-flex align-items-start mb-2">
                                        <img src="images/user-default.png" alt="User avatar" class="rounded-circle me-2" width="48" height="48">
                                        <textarea id="post-content" class="form-control flex-fill" placeholder="Что у вас нового?" rows="3" required></textarea>
                                    </div>
                                    <div class="d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="bi bi-send"></i> Опубликовать
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </section>
                    <ul id="posts" class="list-unstyled mb-0">
                        <li class="text-center text-muted py-5 opacity-75" id="no-posts" style="list-style: none;">
                            <i class="bi bi-card-text fs-2 mb-3 d-block"></i>
                            В ленте пока нет постов.
                        </li>
                    </ul>
                </div>
            </div>
            <!-- Sidebar right -->
            <aside class="col-lg-3 d-none d-lg-block">
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">
                            <i class="bi bi-graph-up-arrow me-1"></i>Тренды
                        </h6>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="trend-badge">#новости</span>
                            <span class="trend-badge">#it</span>
                            <span class="trend-badge">#музыка</span>
                            <span class="trend-badge">#спорт</span>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">
                            <i class="bi bi-person-plus me-1"></i>Кого почитать
                        </h6>
                        <div class="d-flex align-items-center mb-2">
                            <img src="images/user3.png" class="rounded-circle me-2" width="32" height="32" alt="user">
                            <span>Светлана К.</span>
                        </div>
                        <div class="d-flex align-items-center mb-2">
                            <img src="images/user2.png" class="rounded-circle me-2" width="32" height="32" alt="user">
                            <span>Пётр Иванов</span>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/user.js"></script>
    <script src="js/post.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
