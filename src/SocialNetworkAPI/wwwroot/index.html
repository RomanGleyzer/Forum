<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>SocNet — Лента</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <!-- Шапка только логотип + поиск -->
    <nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm py-2 px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary fs-3 me-3" href="index.html" style="letter-spacing:0.5px;">SocNet</a>
            <form class="d-none d-md-flex ms-auto" style="max-width:400px; width:100%;">
                <input type="search" class="form-control rounded-pill" placeholder="Поиск по SocNet...">
            </form>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <!-- Sidebar left: навигация -->
            <aside class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-white border-end min-vh-100 sidebar-nav shadow-sm position-sticky" style="top: 0; height: 100vh; z-index: 100;">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4">               
                    <div class="w-100 mb-4">
                        <div class="d-flex align-items-center p-2 rounded-3 user-block shadow-sm bg-light">
                            <img id="sidebar-avatar" src="images/user-default.png" alt="User avatar" class="rounded-circle me-3" width="44" height="44">
                            <div id="sidebar-username" class="fw-semibold"></div>
                        </div>
                    </div>                  
                    <ul class="nav nav-pills flex-column mb-auto w-100 gap-2">
                        <li class="nav-item w-100">
                            <a href="index.html" class="nav-link active d-flex align-items-center px-3">
                                <i class="bi bi-house me-2"></i>
                                <span class="d-none d-sm-inline">Лента</span>
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="profile.html" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-person me-2"></i>
                                <span class="d-none d-sm-inline">Профиль</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 d-sm-none mt-2">
                            <form class="d-flex">
                                <input type="search" class="form-control rounded-pill" placeholder="Поиск...">
                            </form>
                        </li>
                        <li class="nav-item w-100">
                            <a href="#" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-chat-dots me-2"></i>
                                <span class="d-none d-sm-inline">Сообщения</span>
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="#" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-people me-2"></i>
                                <span class="d-none d-sm-inline">Друзья</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>
            <!-- Feed center -->
            <main class="col px-3 py-5">
                <div class="feed-bg p-4 mb-4 shadow-sm">
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-house-heart text-primary fs-2 me-3"></i>
                        <span class="fw-semibold fs-4">Лента</span>
                    </div>
                    <!-- Создание поста -->
                    <section id="create-post" style="display:none;">
                        <div class="card mb-4 post-card">
                            <div class="card-body">
                                <form id="post-form">
                                    <div class="d-flex align-items-start mb-3">
                                        <img src="images/user-default.png" alt="User avatar" class="rounded-circle me-3" width="48" height="48">
                                        <textarea id="post-content" class="form-control flex-fill" placeholder="Что у вас нового?" rows="3" required></textarea>
                                    </div>
                                    <div class="d-flex justify-content-end">
                                        <button type="submit" class="btn btn-primary px-4 rounded-pill shadow-sm">
                                            <i class="bi bi-send"></i> Опубликовать
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </section>
                    <!-- Посты -->
                    <ul id="posts" class="list-unstyled mb-0">
                        <li class="text-center text-muted py-5 opacity-75" id="no-posts" style="list-style: none;">
                            <i class="bi bi-card-text fs-2 mb-3 d-block"></i>
                            В ленте пока нет постов.
                        </li>
                    </ul>
                </div>
            </main>
        </div>
    </div>
    <script src="js/feed.js"></script>
    <script src="js/app.js"></script>
    <script src="js/user.js"></script>
    <script src="js/post.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
