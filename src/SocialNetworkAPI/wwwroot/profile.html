<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8"/>
    <title>Профиль | SocNet</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <link href="css/styles.css" rel="stylesheet"/>

    <style>
        body {
            background: var(--socnet-bg);
        }

        .sidebar-nav {
            background: #fff;
            border-inline-end: 1.5px solid #e4eaff;
        }

        #profile-avatar,
        .change-avatar-overlay {
            cursor: pointer;
        }

        .ui-profile-header .card-body {
            padding-top: 0;
        }

        .ui-profile-head {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-areas:
                "avatar name"
                "avatar meta"
                "avatar actions"
                "avatar bio";
            gap: 12px 16px;
        }

        @media (min-width: 768px) {
            .ui-profile-head {
                grid-template-columns: auto 1fr auto;
                grid-template-areas:
                    "avatar name actions"
                    "avatar meta actions"
                    "avatar bio actions";
                gap: 12px 20px;
            }
        }

        .ui-profile-head__avatar {
            grid-area: avatar;
        }

        .ui-profile-head__name {
            grid-area: name;
            align-self: end;
        }

        .ui-profile-head__meta {
            grid-area: meta;
        }

        .ui-profile-head__bio {
            grid-area: bio;
        }

        .ui-profile-head__actions {
            grid-area: actions;
            align-self: end;
            justify-self: end;
        }

        .ui-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
        }

        .ui-stat-pill {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-elevated);
        }

        .ui-stat__value {
            font-weight: 700;
        }

        .ui-stat__label {
            color: var(--text-muted);
            font-size: 12px;
        }

        .ui-profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media (max-width: 767px) {
            .ui-profile-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body class="ui-shell">
<a class="ui-skip-link" href="#profile-main">Перейти к содержимому</a>

<nav aria-label="Основная навигация" class="navbar navbar-light bg-white border-bottom sticky-top py-2 px-3"
     role="navigation">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-primary fs-3 me-3" href="index.html"
           style="letter-spacing:.5px;">SocNet</a>

        <form aria-label="Поиск по SocNet" class="d-none d-md-flex ms-auto" role="search"
              style="max-width:420px;width:100%;">
            <label class="visually-hidden" for="top-search">Поиск</label>
            <input aria-label="Поиск по SocNet" autocomplete="off" class="form-control" id="top-search"
                   placeholder="Поиск по SocNet…" type="search"/>
        </form>

        <button aria-label="Переключить тему" class="btn btn-sm btn-outline-secondary ms-2" id="theme-toggle"
                type="button">
            <i aria-hidden="true" class="bi bi-moon"></i>
        </button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row flex-nowrap">

        <aside
                aria-label="Боковая навигация"
                class="col-auto col-md-3 col-xl-2 px-sm-2 px-3 bg-white border-end min-vh-100 sidebar-nav shadow-sm position-sticky"
                style="top:0;z-index:100;">
            <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 pb-3">
                <ul class="nav nav-pills flex-column mb-auto w-100 gap-1">
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="index.html">
                            <i aria-hidden="true" class="bi bi-house-door"></i><span
                                class="d-none d-sm-inline">Лента</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a aria-current="page" class="nav-link d-flex align-items-center gap-2 active"
                           href="profile.html">
                            <i aria-hidden="true" class="bi bi-person"></i><span
                                class="d-none d-sm-inline">Профиль</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <main class="col py-3" id="profile-main" role="main" tabindex="-1">
            <section aria-label="Профиль пользователя" class="ui-feed">

                <div class="card ui-surface overflow-hidden mb-3 ui-profile-header">
                    <div aria-hidden="true" class="ui-profile-cover profile-cover"></div>

                    <div class="card-body">
                        <div class="ui-profile-head">

                            <div class="ui-profile-head__avatar ui-profile-avatar-wrap" style="margin-top:-60px;">
                                <div class="profile-avatar-wrapper">
                                    <img alt="Аватар профиля"
                                         aria-label="Сменить аватар"
                                         class="profile-avatar rounded-circle ui-avatar ui-avatar--120" decoding="async"
                                         id="profile-avatar"
                                         loading="lazy" role="button" src="images/user-default.png" tabindex="0">

                                    <div aria-label="Сменить аватар"
                                         class="change-avatar-overlay d-flex align-items-center justify-content-center"
                                         role="button" tabindex="0">
                                        <i aria-hidden="true" class="bi bi-camera fs-4"></i>
                                    </div>

                                    <span class="status-indicator badge bg-success rounded-circle"
                                          title="Онлайн"></span>
                                    <div class="spinner-overlay d-none" id="avatar-spinner">
                                        <div aria-label="Загрузка" class="spinner-border text-light spinner-border-sm"
                                             role="status"></div>
                                    </div>
                                </div>
                                <input accept="image/*" class="d-none" id="avatar-upload" type="file">
                            </div>

                            <div class="ui-profile-head__name">
                                <div class="d-flex flex-wrap align-items-center gap-2">
                                    <h1 class="h4 m-0" id="profile-username">Имя пользователя</h1>
                                    <span class="badge rounded-pill bg-primary-subtle text-primary d-none"
                                          id="profile-verified">
                                            <i aria-hidden="true" class="bi bi-patch-check-fill"></i> Подтвержден
                                        </span>
                                </div>
                            </div>

                            <div class="ui-profile-head__meta">
                                <ul aria-label="Статистика профиля" class="ui-stats list-unstyled m-0">
                                    <li class="ui-stat-pill">
                                        <span class="ui-stat__value" id="posts-count">0</span>
                                        <span class="ui-stat__label">постов</span>
                                    </li>
                                    <li class="ui-stat-pill">
                                        <span class="ui-stat__value" id="followers-count">0</span>
                                        <span class="ui-stat__label">подписчики</span>
                                    </li>
                                    <li class="ui-stat-pill">
                                        <span class="ui-stat__value" id="following-count">0</span>
                                        <span class="ui-stat__label">подписки</span>
                                    </li>
                                </ul>
                            </div>

                            <div class="ui-profile-head__actions">
                                <div class="ui-profile-actions">
                                    <button class="btn btn-primary btn-sm" data-action="openComposer"
                                            id="new-post-btn-profile"
                                            type="button">
                                        <i aria-hidden="true" class="bi bi-plus-circle me-1"></i> Новый пост
                                    </button>
                                    <button class="btn btn-light btn-sm" data-bs-target="#editProfileModal"
                                            data-bs-toggle="modal"
                                            data-ui-tooltip="Редактировать профиль" id="edit-profile-btn"
                                            type="button">
                                        <i aria-hidden="true" class="bi bi-pencil"></i> Редактировать
                                    </button>
                                    <button class="btn btn-light btn-sm" id="share-profile-btn" type="button">
                                        <i aria-hidden="true" class="bi bi-share"></i> Поделиться
                                    </button>
                                </div>
                            </div>

                            <div class="ui-profile-head__bio">
                                <p class="profile-bio ui-prose text-muted mt-2 mb-0" id="profile-bio"></p>
                            </div>
                        </div>

                        <div class="ui-profile-tabs mt-3">
                            <ul class="nav nav-tabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button aria-controls="panel-posts" aria-selected="true" class="nav-link active"
                                            data-bs-target="#panel-posts" data-bs-toggle="tab" id="tab-posts"
                                            role="tab" type="button">
                                        Посты
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button aria-controls="panel-about" aria-selected="false" class="nav-link"
                                            data-bs-target="#panel-about" data-bs-toggle="tab" id="tab-about"
                                            role="tab" type="button">
                                        О себе
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button aria-controls="panel-photos" aria-selected="false" class="nav-link"
                                            data-bs-target="#panel-photos" data-bs-toggle="tab" id="tab-photos"
                                            role="tab" type="button">
                                        Фото
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="tab-content">

                    <section aria-labelledby="tab-posts" class="tab-pane fade show active" id="panel-posts"
                             role="tabpanel">
                        <h2 class="visually-hidden" id="user-posts-title">Посты пользователя</h2>
                        <div aria-busy="false" aria-live="polite" id="profile-posts">

                            <div class="no-content text-center px-3 my-3 d-none" id="no-posts" role="status">
                                <i aria-hidden="true" class="bi bi-card-text d-block fs-2 mb-2"></i>
                                У пользователя пока нет постов.
                            </div>

                            <div aria-hidden="true" class="d-none" id="profile-posts-skeleton">
                                <article class="card post-card mb-3 p-3">
                                    <div class="d-flex gap-3">
                                        <div class="ui-skeleton rounded-circle"
                                             style="inline-size:48px;block-size:48px;"></div>
                                        <div class="flex-grow-1">
                                            <div class="ui-skeleton mb-2" style="inline-size:35%;block-size:14px;">
                                            </div>
                                            <div class="ui-skeleton mb-2" style="inline-size:95%;block-size:12px;">
                                            </div>
                                            <div class="ui-skeleton mb-2" style="inline-size:85%;block-size:12px;">
                                            </div>
                                            <div class="ui-skeleton ui-media ui-media--16x9 mt-2"></div>
                                        </div>
                                    </div>
                                </article>
                                <article class="card post-card mb-3 p-3">
                                    <div class="d-flex gap-3">
                                        <div class="ui-skeleton rounded-circle"
                                             style="inline-size:48px;block-size:48px;"></div>
                                        <div class="flex-grow-1">
                                            <div class="ui-skeleton mb-2" style="inline-size:40%;block-size:14px;">
                                            </div>
                                            <div class="ui-skeleton mb-2" style="inline-size:90%;block-size:12px;">
                                            </div>
                                            <div class="ui-skeleton" style="inline-size:70%;block-size:12px;"></div>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </div>
                    </section>

                    <section aria-labelledby="tab-about" class="tab-pane fade" id="panel-about" role="tabpanel">
                        <div class="card ui-surface mt-3">
                            <div class="card-body">
                                <h2 class="h5">О себе</h2>
                                <dl class="row mb-0">
                                    <dt class="col-sm-3">Имя</dt>
                                    <dd class="col-sm-9" id="about-name">—</dd>
                                    <dt class="col-sm-3">E-mail</dt>
                                    <dd class="col-sm-9" id="about-email">—</dd>
                                    <dt class="col-sm-3">Дата рождения</dt>
                                    <dd class="col-sm-9" id="about-birthdate">—</dd>
                                    <dt class="col-sm-3">О себе</dt>
                                    <dd class="col-sm-9" id="about-bio">—</dd>
                                </dl>
                            </div>
                        </div>
                    </section>

                    <section aria-labelledby="tab-photos" class="tab-pane fade" id="panel-photos" role="tabpanel">
                        <div class="card ui-surface mt-3">
                            <div class="card-body">
                                <h2 class="h5">Фотографии</h2>
                                <div class="row g-2" id="photos-grid"></div>
                                <div class="text-center text-muted py-4 d-none" id="no-photos">Пока нет фотографий.
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </main>
    </div>
</div>

<div aria-hidden="true" aria-labelledby="editProfileModalLabel" class="modal fade" id="editProfileModal"
     tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <form id="update-user-form" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title h5" id="editProfileModalLabel">Редактировать профиль</h2>
                    <button aria-label="Закрыть" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label" for="displayName">Отображаемое имя</label>
                        <input class="form-control" id="displayName" name="displayName" required type="text">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail</label>
                        <input class="form-control" id="email" name="email" required type="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="dateOfBirth">Дата рождения</label>
                        <input class="form-control" id="dateOfBirth" name="dateOfBirth" required type="date">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="about">О себе</label>
                        <textarea class="form-control" id="about" name="about" rows="3"></textarea>
                    </div>

                    <div class="alert alert-danger py-2 d-none" id="update-user-error" role="alert"></div>
                    <div class="alert alert-success py-2 d-none" id="update-user-success" role="status"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="submit">Сохранить</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="js/profile.js" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
