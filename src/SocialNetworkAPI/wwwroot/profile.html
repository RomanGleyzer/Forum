<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>Профиль | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />

    <link rel="stylesheet" href="css/styles.css" />

    <style>
        body {
            background: var(--socnet-bg);
        }

        .sidebar-nav {
            background: #fff;
            border-inline-end: 1.5px solid #e4eaff;
        }

        #profile-avatar,
        .change-avatar-overlay {
            cursor: pointer;
        }

        .ui-profile-header .card-body {
            padding-top: 0;
        }

        .ui-profile-head {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-areas:
                "avatar name"
                "avatar meta"
                "avatar actions"
                "avatar bio";
            gap: 12px 16px;
        }

        @media (min-width: 768px) {
            .ui-profile-head {
                grid-template-columns: auto 1fr auto;
                grid-template-areas:
                    "avatar name actions"
                    "avatar meta actions"
                    "avatar bio actions";
                gap: 12px 20px;
            }
        }

        .ui-profile-head__avatar {
            grid-area: avatar;
        }

        .ui-profile-head__name {
            grid-area: name;
            align-self: end;
        }

        .ui-profile-head__meta {
            grid-area: meta;
        }

        .ui-profile-head__bio {
            grid-area: bio;
        }

        .ui-profile-head__actions {
            grid-area: actions;
            align-self: end;
            justify-self: end;
        }

        .ui-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
        }

        .ui-stat-pill {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--bg-elevated);
        }

        .ui-stat__value {
            font-weight: 700;
        }

        .ui-stat__label {
            color: var(--text-muted);
            font-size: 12px;
        }

        .ui-profile-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        @media (max-width: 767px) {
            .ui-profile-actions {
                justify-content: flex-start;
            }
        }
    </style>
</head>

<body class="ui-shell">
    <a href="#profile-main" class="ui-skip-link">Перейти к содержимому</a>

    <nav class="navbar navbar-light bg-white border-bottom sticky-top py-2 px-3" role="navigation"
        aria-label="Основная навигация">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary fs-3 me-3" href="index.html"
                style="letter-spacing:.5px;">SocNet</a>

            <form class="d-none d-md-flex ms-auto" role="search" aria-label="Поиск по SocNet"
                style="max-width:420px;width:100%;">
                <label for="top-search" class="visually-hidden">Поиск</label>
                <input id="top-search" type="search" class="form-control" placeholder="Поиск по SocNet…"
                    aria-label="Поиск по SocNet" autocomplete="off" />
            </form>

            <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-2" aria-label="Переключить тему"
                type="button">
                <i class="bi bi-moon" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row flex-nowrap">

            <aside
                class="col-auto col-md-3 col-xl-2 px-sm-2 px-3 bg-white border-end min-vh-100 sidebar-nav shadow-sm position-sticky"
                style="top:0;z-index:100;" aria-label="Боковая навигация">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 pb-3">
                    <ul class="nav nav-pills flex-column mb-auto w-100 gap-1">
                        <li class="nav-item">
                            <a href="index.html" class="nav-link d-flex align-items-center gap-2">
                                <i class="bi bi-house-door" aria-hidden="true"></i><span
                                    class="d-none d-sm-inline">Лента</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="profile.html" class="nav-link d-flex align-items-center gap-2 active"
                                aria-current="page">
                                <i class="bi bi-person" aria-hidden="true"></i><span
                                    class="d-none d-sm-inline">Профиль</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </aside>

            <main id="profile-main" class="col py-3" role="main" tabindex="-1">
                <section class="ui-feed" aria-label="Профиль пользователя">

                    <div class="card ui-surface overflow-hidden mb-3 ui-profile-header">
                        <div class="ui-profile-cover profile-cover" aria-hidden="true"></div>

                        <div class="card-body">
                            <div class="ui-profile-head">

                                <div class="ui-profile-head__avatar ui-profile-avatar-wrap" style="margin-top:-60px;">
                                    <div class="profile-avatar-wrapper">
                                        <img id="profile-avatar"
                                            class="profile-avatar rounded-circle ui-avatar ui-avatar--120"
                                            src="images/user-default.png" alt="Аватар профиля" loading="lazy"
                                            decoding="async" role="button" tabindex="0" aria-label="Сменить аватар">

                                        <div class="change-avatar-overlay d-flex align-items-center justify-content-center"
                                            role="button" tabindex="0" aria-label="Сменить аватар">
                                            <i class="bi bi-camera fs-4" aria-hidden="true"></i>
                                        </div>

                                        <span class="status-indicator badge bg-success rounded-circle"
                                            title="Онлайн"></span>
                                        <div class="spinner-overlay d-none" id="avatar-spinner">
                                            <div class="spinner-border text-light spinner-border-sm" role="status"
                                                aria-label="Загрузка"></div>
                                        </div>
                                    </div>
                                    <input id="avatar-upload" type="file" class="d-none" accept="image/*">
                                </div>

                                <div class="ui-profile-head__name">
                                    <div class="d-flex flex-wrap align-items-center gap-2">
                                        <h1 id="profile-username" class="h4 m-0">Имя пользователя</h1>
                                        <span id="profile-verified"
                                            class="badge rounded-pill bg-primary-subtle text-primary d-none">
                                            <i class="bi bi-patch-check-fill" aria-hidden="true"></i> Подтвержден
                                        </span>
                                    </div>
                                </div>

                                <div class="ui-profile-head__meta">
                                    <ul class="ui-stats list-unstyled m-0" aria-label="Статистика профиля">
                                        <li class="ui-stat-pill">
                                            <span class="ui-stat__value" id="posts-count">0</span>
                                            <span class="ui-stat__label">постов</span>
                                        </li>
                                        <li class="ui-stat-pill">
                                            <span class="ui-stat__value" id="followers-count">0</span>
                                            <span class="ui-stat__label">подписчики</span>
                                        </li>
                                        <li class="ui-stat-pill">
                                            <span class="ui-stat__value" id="following-count">0</span>
                                            <span class="ui-stat__label">подписки</span>
                                        </li>
                                    </ul>
                                </div>

                                <div class="ui-profile-head__actions">
                                    <div class="ui-profile-actions">
                                        <button class="btn btn-primary btn-sm" type="button" data-action="openComposer"
                                            id="new-post-btn-profile">
                                            <i class="bi bi-plus-circle me-1" aria-hidden="true"></i> Новый пост
                                        </button>
                                        <button id="edit-profile-btn" type="button" class="btn btn-light btn-sm"
                                            data-bs-toggle="modal" data-bs-target="#editProfileModal"
                                            data-ui-tooltip="Редактировать профиль">
                                            <i class="bi bi-pencil" aria-hidden="true"></i> Редактировать
                                        </button>
                                        <button id="share-profile-btn" type="button" class="btn btn-light btn-sm">
                                            <i class="bi bi-share" aria-hidden="true"></i> Поделиться
                                        </button>
                                    </div>
                                </div>

                                <div class="ui-profile-head__bio">
                                    <p id="profile-bio" class="profile-bio ui-prose text-muted mt-2 mb-0"></p>
                                </div>
                            </div>

                            <div class="ui-profile-tabs mt-3">
                                <ul class="nav nav-tabs" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button id="tab-posts" class="nav-link active" data-bs-toggle="tab"
                                            data-bs-target="#panel-posts" type="button" role="tab"
                                            aria-controls="panel-posts" aria-selected="true">
                                            Посты
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button id="tab-about" class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#panel-about" type="button" role="tab"
                                            aria-controls="panel-about" aria-selected="false">
                                            О себе
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button id="tab-photos" class="nav-link" data-bs-toggle="tab"
                                            data-bs-target="#panel-photos" type="button" role="tab"
                                            aria-controls="panel-photos" aria-selected="false">
                                            Фото
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="tab-content">

                        <section id="panel-posts" class="tab-pane fade show active" role="tabpanel"
                            aria-labelledby="tab-posts">
                            <h2 id="user-posts-title" class="visually-hidden">Посты пользователя</h2>
                            <div id="profile-posts" aria-live="polite" aria-busy="false">

                                <div id="no-posts" class="no-content text-center px-3 my-3 d-none" role="status">
                                    <i class="bi bi-card-text d-block fs-2 mb-2" aria-hidden="true"></i>
                                    У пользователя пока нет постов.
                                </div>

                                <div id="profile-posts-skeleton" class="d-none" aria-hidden="true">
                                    <article class="card post-card mb-3 p-3">
                                        <div class="d-flex gap-3">
                                            <div class="ui-skeleton rounded-circle"
                                                style="inline-size:48px;block-size:48px;"></div>
                                            <div class="flex-grow-1">
                                                <div class="ui-skeleton mb-2" style="inline-size:35%;block-size:14px;">
                                                </div>
                                                <div class="ui-skeleton mb-2" style="inline-size:95%;block-size:12px;">
                                                </div>
                                                <div class="ui-skeleton mb-2" style="inline-size:85%;block-size:12px;">
                                                </div>
                                                <div class="ui-skeleton ui-media ui-media--16x9 mt-2"></div>
                                            </div>
                                        </div>
                                    </article>
                                    <article class="card post-card mb-3 p-3">
                                        <div class="d-flex gap-3">
                                            <div class="ui-skeleton rounded-circle"
                                                style="inline-size:48px;block-size:48px;"></div>
                                            <div class="flex-grow-1">
                                                <div class="ui-skeleton mb-2" style="inline-size:40%;block-size:14px;">
                                                </div>
                                                <div class="ui-skeleton mb-2" style="inline-size:90%;block-size:12px;">
                                                </div>
                                                <div class="ui-skeleton" style="inline-size:70%;block-size:12px;"></div>
                                            </div>
                                        </div>
                                    </article>
                                </div>
                            </div>
                        </section>

                        <section id="panel-about" class="tab-pane fade" role="tabpanel" aria-labelledby="tab-about">
                            <div class="card ui-surface mt-3">
                                <div class="card-body">
                                    <h2 class="h5">О себе</h2>
                                    <dl class="row mb-0">
                                        <dt class="col-sm-3">Имя</dt>
                                        <dd id="about-name" class="col-sm-9">—</dd>
                                        <dt class="col-sm-3">E-mail</dt>
                                        <dd id="about-email" class="col-sm-9">—</dd>
                                        <dt class="col-sm-3">Дата рождения</dt>
                                        <dd id="about-birthdate" class="col-sm-9">—</dd>
                                        <dt class="col-sm-3">О себе</dt>
                                        <dd id="about-bio" class="col-sm-9">—</dd>
                                    </dl>
                                </div>
                            </div>
                        </section>

                        <section id="panel-photos" class="tab-pane fade" role="tabpanel" aria-labelledby="tab-photos">
                            <div class="card ui-surface mt-3">
                                <div class="card-body">
                                    <h2 class="h5">Фотографии</h2>
                                    <div id="photos-grid" class="row g-2"></div>
                                    <div id="no-photos" class="text-center text-muted py-4 d-none">Пока нет фотографий.
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <form id="update-user-form" novalidate>
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="editProfileModalLabel">Редактировать профиль</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="displayName" class="form-label">Отображаемое имя</label>
                            <input id="displayName" name="displayName" type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input id="email" name="email" type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="dateOfBirth" class="form-label">Дата рождения</label>
                            <input id="dateOfBirth" name="dateOfBirth" type="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="about" class="form-label">О себе</label>
                            <textarea id="about" name="about" class="form-control" rows="3"></textarea>
                        </div>

                        <div id="update-user-error" class="alert alert-danger py-2 d-none" role="alert"></div>
                        <div id="update-user-success" class="alert alert-success py-2 d-none" role="status"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
