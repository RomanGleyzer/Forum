<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Профиль | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SocNet</a>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Лента</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Друзья</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Сообщения</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Профиль</a></li>
                    <li class="nav-item" id="logout-nav"><a class="nav-link" href="#">Выйти</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container pb-5">
        <div class="row justify-content-center">
            <aside class="col-lg-4 mb-4">
                <div class="card rounded-4 shadow-lg border-0">
                    <div class="profile-cover"></div>
                    <div class="card-body text-center pt-0">
                        <img src="images/user-default.png" alt="User avatar" class="profile-avatar rounded-circle mb-2">
                        <h4 id="sidebar-username" class="fw-bold mt-2 mb-0">Профиль</h4>
                        <div id="sidebar-email" class="text-muted small mb-1"></div>
                        <div class="mb-3">
                            <span class="badge bg-success"><i class="bi bi-circle-fill me-1 small"></i>online</span>
                        </div>
                        <button class="btn btn-outline-primary btn-sm w-100 mb-2">
                            <i class="bi bi-pencil"></i> Редактировать профиль
                        </button>
                    </div>
                </div>
            </aside>
            <div class="col-lg-8">
                <section id="profile-info" class="mb-4">
                    <div class="card rounded-4 shadow-sm border-0">
                        <div class="card-body">
                            <h2 class="card-title h5 mb-3 fw-bold">
                                <i class="bi bi-person-circle me-2"></i>Информация о пользователе
                            </h2>
                            <ul class="list-group list-group-flush">
                                <li class="list-group-item px-0">
                                    <i class="bi bi-envelope me-2 text-primary"></i>
                                    <span id="user-email"></span>
                                </li>
                                <li class="list-group-item px-0">
                                    <i class="bi bi-calendar-event me-2 text-primary"></i>
                                    <span id="user-birthdate"></span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </section>
                <section id="user-posts">
                    <h2 class="h5 mb-3 fw-bold">
                        <i class="bi bi-chat-left-text me-2"></i>Ваши посты
                    </h2>
                    <div id="profile-posts">
                        <div class="text-center text-muted py-5 opacity-75" id="no-posts">
                            <i class="bi bi-card-text fs-2 mb-3 d-block"></i>
                            У вас пока нет постов.
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
