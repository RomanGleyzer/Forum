<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Профиль | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom sticky-top shadow-sm py-2 px-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary fs-3 me-3" href="index.html" style="letter-spacing:0.5px;">SocNet</a>
            <form class="d-none d-md-flex ms-auto" style="max-width:400px; width:100%;">
                <input type="search" class="form-control rounded-pill" placeholder="Поиск по SocNet...">
            </form>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row flex-nowrap">
            <aside class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-white border-end min-vh-100 sidebar-nav shadow-sm position-sticky" style="top: 0; height: 100vh; z-index: 100;">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4">
                    <ul class="nav nav-pills flex-column mb-auto w-100 gap-2">
                        <li class="nav-item w-100">
                            <a href="index.html" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-house me-2"></i>
                                <span class="d-none d-sm-inline">Лента</span>
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="#" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-chat-dots me-2"></i>
                                <span class="d-none d-sm-inline">Сообщения</span>
                            </a>
                        </li>
                        <li class="nav-item w-100">
                            <a href="#" class="nav-link d-flex align-items-center px-3">
                                <i class="bi bi-people me-2"></i>
                                <span class="d-none d-sm-inline">Друзья</span>
                            </a>
                        </li>
                        <li class="nav-item w-100 d-sm-none mt-2">
                            <form class="d-flex">
                                <input type="search" class="form-control rounded-pill" placeholder="Поиск...">
                            </form>
                        </li>
                    </ul>
                </div>
            </aside>
            <main class="col px-3 py-5">
                <div class="row justify-content-center">
                    <div class="col-lg-10 col-xl-9">
                        <div class="card rounded-4 shadow-lg border-0 mb-4 text-center">
                            <div class="profile-cover"></div>
                            <div class="card-body pt-0">

                                <div class="position-relative d-inline-block">
                                    <img id="profile-avatar" src="images/user-default.png" alt="User avatar"
                                         class="profile-avatar rounded-circle mb-2">

                                    <input type="file" id="avatar-upload" accept="image/*" class="d-none">

                                    <button type="button" id="change-avatar-btn"
                                            class="btn btn-sm btn-light border position-absolute bottom-0 end-0 rounded-circle"
                                            style="transform: translate(10%, -10%);">
                                        <i class="bi bi-camera"></i>
                                    </button>
                                </div>

                                <h4 id="profile-fullname" class="fw-bold mt-2 mb-1"></h4>
                                <div id="profile-email" class="text-muted mb-2"></div>
                                <div id="profile-birthdate" class="text-muted mb-2"></div>
                                <div id="profile-bio" class="profile-bio mb-3"></div>
                                <button class="btn btn-outline-primary btn-sm px-3 mt-2" id="edit-profile-btn">
                                    <i class="bi bi-pencil"></i> Редактировать
                                </button>
                            </div>
                        </div>
                        <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
                            <div class="modal-dialog">
                                <form class="modal-content" id="edit-profile-form" autocomplete="off">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="editProfileModalLabel">Редактировать профиль</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="mb-3">
                                            <label for="firstName" class="form-label">Имя</label>
                                            <input type="text" class="form-control" id="firstName" name="firstName" required />
                                        </div>
                                        <div class="mb-3">
                                            <label for="lastName" class="form-label">Фамилия</label>
                                            <input type="text" class="form-control" id="lastName" name="lastName" required />
                                        </div>
                                        <div class="mb-3">
                                            <label for="email" class="form-label">E-mail</label>
                                            <input type="email" class="form-control" id="email" name="email" required />
                                        </div>
                                        <div class="mb-3">
                                            <label for="dateOfBirth" class="form-label">Дата рождения</label>
                                            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required />
                                        </div>
                                        <div class="mb-3">
                                            <label for="about" class="form-label">О себе</label>
                                            <textarea class="form-control" id="about" name="about" rows="2"></textarea>
                                        </div>
                                        <div id="update-user-error" class="alert alert-danger py-2 d-none"></div>
                                        <div id="update-user-success" class="alert alert-success py-2 d-none"></div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-primary">Сохранить</button>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <section id="user-posts">
                            <h2 class="h5 mb-3 fw-bold">
                                <i class="bi bi-chat-left-text me-2"></i>Ваши посты
                            </h2>
                            <div id="profile-posts">
                                <div class="text-center text-muted py-5 opacity-75" id="no-posts">
                                    <i class="bi bi-card-text fs-2 mb-3 d-block"></i>
                                    У вас пока нет постов.
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="shared.js"></script>
    <script type="module" src="js/profile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
