<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Регистрация | SocNet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
</head>
<body class="ui-shell">
    <a href="#register-main" class="ui-skip-link">Перейти к содержимому</a>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">SocNet</a>
            <button id="theme-toggle" class="btn btn-sm btn-light ms-auto" aria-label="Переключить тему">
                <i class="bi bi-moon"></i>
            </button>
        </div>
    </nav>
    <main id="register-main" class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 80vh;" role="main" tabindex="-1">
        <div class="col-md-7 col-lg-6">
            <div class="card rounded-4 shadow-lg border-0 mt-4">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <span class="bg-primary bg-gradient text-white rounded-circle p-3 fs-2 shadow-sm">
                            <i class="bi bi-person-plus"></i>
                        </span>
                    </div>
                    <h2 class="card-title h4 mb-2 text-center fw-bold">Создать аккаунт</h2>
                    <p class="text-center text-muted small mb-4">Добро пожаловать в SocNet! Пожалуйста, заполните данные для регистрации.</p>
                    <form id="register-form" autocomplete="on" aria-describedby="register-help">
                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control ui-input" id="reg-firstname" name="firstName"
                                           placeholder="Имя" autocomplete="given-name" required />
                                    <label for="reg-firstname">Имя</label>
                                </div>
                            </div>
                            <div class="mb-3 col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control ui-input" id="reg-lastname" name="lastName"
                                           placeholder="Фамилия" autocomplete="family-name" required />
                                    <label for="reg-lastname">Фамилия</label>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="email" class="form-control ui-input" id="reg-email" name="email"
                                       placeholder="Email" autocomplete="email" inputmode="email" required />
                                <label for="reg-email">Email</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-floating">
                                <input type="text" class="form-control ui-input" id="reg-birthdate" name="birthDate"
                                       placeholder="Дата рождения" autocomplete="bday" required />
                                <label for="reg-birthdate">Дата рождения</label>
                            </div>
                        </div>
                        <div class="row">
                            <div class="mb-3 col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control ui-input" id="reg-password" name="password"
                                           placeholder="Пароль" autocomplete="new-password" required minlength="6" />
                                    <label for="reg-password">Пароль</label>
                                </div>
                            </div>
                            <div class="mb-3 col-md-6">
                                <div class="form-floating">
                                    <input type="password" class="form-control ui-input" id="reg-confirm" name="confirmPassword"
                                           placeholder="Повторите пароль" autocomplete="new-password" required minlength="6" />
                                    <label for="reg-confirm">Повторите пароль</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mt-2 ui-button">
                            <i class="bi bi-person-plus me-1"></i> Зарегистрироваться
                        </button>
                        <p class="mt-3 text-center text-secondary small">
                            Уже есть аккаунт?
                            <a href="login.html" class="text-primary fw-semibold text-decoration-none">Войти</a>
                        </p>
                        <div id="register-help" class="visually-hidden">Заполните все обязательные поля формы регистрации</div>
                    </form>
                </div>
            </div>
            <div class="text-center mt-4 text-muted small opacity-75">
                © 2025 SocNet
            </div>
        </div>
    </main>
    <script type="module" src="shared.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script>
        flatpickr("#reg-birthdate", {
            dateFormat: "Y-m-d",
            maxDate: "today",
            locale: "ru",
            altInput: true,
            altFormat: "d.m.Y",
            allowInput: true
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
