<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8"/>
    <title>Регистрация | SocNet</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="light dark" name="color-scheme"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css" rel="stylesheet"/>

    <link href="css/styles.css" rel="stylesheet"/>

    <style>
        body {
            background: var(--socnet-bg);
        }

        .auth-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            background: var(--bg-elevated);
        }

        .brand-badge {
            display: inline-grid;
            place-items: center;
            inline-size: 56px;
            block-size: 56px;
            border-radius: 50%;
        }
    </style>
</head>

<body class="ui-shell">
<a class="ui-skip-link" href="#register-main">Перейти к содержимому</a>

<nav aria-label="Основная навигация" class="navbar navbar-light bg-white border-bottom sticky-top py-2 px-3"
     role="navigation">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" href="index.html" style="letter-spacing: 0.5px">SocNet</a>
        <button aria-label="Переключить тему" class="btn btn-sm btn-outline-secondary ms-auto" id="theme-toggle"
                type="button">
            <i aria-hidden="true" class="bi bi-moon"></i>
        </button>
    </div>
</nav>

<main class="container py-5" id="register-main" role="main" tabindex="-1">
    <div class="row justify-content-center">
        <div class="col-sm-11 col-md-8 col-lg-6">
            <section aria-labelledby="register-title" class="auth-card p-4 p-md-5">
                <div class="text-center mb-3">
                        <span class="brand-badge bg-primary text-white shadow-sm">
                            <i aria-hidden="true" class="bi bi-person-plus fs-3"></i>
                        </span>
                </div>
                <h1 class="h4 text-center fw-bold mb-1" id="register-title">
                    Создать аккаунт
                </h1>
                <p class="text-center text-muted mb-4">Это быстро и бесплатно</p>

                <div class="alert alert-danger py-2 d-none" id="register-error" role="alert"></div>
                <div class="alert alert-success py-2 d-none" id="register-success" role="status"></div>

                <form aria-describedby="register-help" id="register-form" novalidate>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input autocomplete="given-name" class="form-control ui-input" id="reg-firstname"
                                       placeholder="Имя" required type="text"/>
                                <label for="reg-firstname">Имя</label>
                                <div class="invalid-feedback">Укажите имя.</div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-floating">
                                <input autocomplete="family-name" class="form-control ui-input" id="reg-lastname"
                                       placeholder="Фамилия" type="text"/>
                                <label for="reg-lastname">Фамилия</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating">
                                <input autocomplete="email" class="form-control ui-input" id="reg-email"
                                       inputmode="email"
                                       placeholder="Email" required type="email"/>
                                <label for="reg-email">Email</label>
                                <div class="invalid-feedback">
                                    Введите корректный email.
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-floating position-relative">
                                <input autocomplete="new-password" class="form-control ui-input" id="reg-password"
                                       placeholder="Пароль" required type="password"/>
                                <label for="reg-password">Пароль</label>
                                <div class="invalid-feedback">Введите пароль.</div>
                                <button aria-label="Показать пароль"
                                        class="btn btn-sm btn-outline-secondary position-absolute top-50 translate-middle-y end-0 me-2"
                                        data-action="togglePassword" data-target="#reg-password"
                                        type="button">
                                    <i aria-hidden="true" class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="form-floating position-relative">
                                <input autocomplete="new-password" class="form-control ui-input" id="reg-confirm"
                                       placeholder="Повторите пароль" required type="password"/>
                                <label for="reg-confirm">Повторите пароль</label>
                                <div class="invalid-feedback">Повторите пароль.</div>
                                <button aria-label="Показать пароль"
                                        class="btn btn-sm btn-outline-secondary position-absolute top-50 translate-middle-y end-0 me-2"
                                        data-action="togglePassword" data-target="#reg-confirm"
                                        type="button">
                                    <i aria-hidden="true" class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-floating">
                                <input autocomplete="bday" class="form-control ui-input" id="reg-birthdate"
                                       inputmode="numeric" placeholder="Дата рождения" type="text"/>
                                <label for="reg-birthdate">Дата рождения</label>
                            </div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-2 rounded-pill mt-4" type="submit">
                        <span aria-hidden="true" class="me-1"><i class="bi bi-check2-circle"></i></span>
                        Зарегистрироваться
                    </button>

                    <p class="mt-4 text-center text-muted small">
                        Уже есть аккаунт?
                        <a class="link-primary" href="login.html">Войти</a>
                    </p>

                    <div class="visually-hidden" id="register-help">
                        Все поля, кроме фамилии и даты рождения, обязательны. Email — в
                        формате user@example.com.
                    </div>
                </form>
            </section>

            <p class="text-center mt-4 text-muted small">© 2025 SocNet</p>
        </div>
    </div>
</main>

<script src="shared.js" type="module"></script>
<script src="js/auth.js" type="module"></script>

<script>
    document.addEventListener(
        "click",
        (e) => {
            const btn = e.target.closest('[data-action="togglePassword"]');
            if (!btn) return;
            const input = document.querySelector(btn.getAttribute("data-target"));
            if (!input) return;
            const type =
                input.getAttribute("type") === "password" ? "text" : "password";
            input.setAttribute("type", type);
            btn.setAttribute(
                "aria-label",
                type === "password" ? "Показать пароль" : "Скрыть пароль"
            );
            const icon = btn.querySelector("i");
            if (icon)
                icon.className =
                    type === "password" ? "bi bi-eye" : "bi bi-eye-slash";
        },
        {passive: true}
    );
</script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
<script>
    flatpickr("#reg-birthdate", {
        dateFormat: "Y-m-d",
        maxDate: "today",
        locale: "ru",
        altInput: true,
        altFormat: "d.m.Y",
        allowInput: true,
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
